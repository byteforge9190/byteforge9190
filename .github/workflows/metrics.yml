# Renders the stats panel as an SVG committed into this repo, so the README
# never depends on a third-party service being up at page-load time.
#
# REQUIRES a classic PAT saved as the METRICS_TOKEN secret — see SETUP.md.
# Until that secret exists the job skips cleanly instead of failing red.
name: Generate metrics panel

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "metrics.svg"
      - "profile-3d-contrib/**"
      - "**.md"

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check that METRICS_TOKEN is configured
        id: guard
        run: echo "ready=${{ secrets.METRICS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Render metrics panel
        if: steps.guard.outputs.ready == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: large
          config_timezone: Europe/London

          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_colors: github

          plugin_lines: yes

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes

      - name: Report that the token is missing
        if: steps.guard.outputs.ready != 'true'
        run: |
          echo "::warning::METRICS_TOKEN is not set — skipping. See SETUP.md step 1."
