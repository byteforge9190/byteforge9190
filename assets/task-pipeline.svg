<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#BE185D"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="18" fill="url(#grid)" opacity="0.55"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="18" fill="none" stroke="#1F2A44"/>

  <!-- title -->
  <text x="48" y="54" fill="#E2E8F0" font-size="22" font-weight="700" letter-spacing="0.2">From screenshot to verifiable task</text>
  <text x="48" y="78" fill="#94A3B8" font-size="13.5">How I turn visual material into coding tasks a reviewer can grade without guessing</text>
  <rect x="48" y="90" width="72" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- connector spine -->
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M266 212 L290 212"/>
    <path d="M490 212 L514 212"/>
    <path d="M714 212 L738 212"/>
    <path d="M938 212 L962 212"/>
  </g>

  <!-- node 1: visual material -->
  <g filter="url(#shadow)">
    <rect x="48" y="130" width="218" height="164" rx="14" fill="#141D33" stroke="#263450"/>
    <rect x="48" y="130" width="218" height="4" rx="2" fill="url(#amber)"/>
  </g>
  <g transform="translate(70,154)">
    <rect width="34" height="34" rx="9" fill="#2A2210"/>
    <rect x="8" y="9" width="18" height="15" rx="2" fill="none" stroke="#FBBF24" stroke-width="1.8"/>
    <circle cx="13.5" cy="14.5" r="2" fill="#FBBF24"/>
    <path d="M9 22 L15 17 L19 20 L23 16 L26 19" fill="none" stroke="#FBBF24" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
  <text x="114" y="169" fill="#F8FAFC" font-size="15" font-weight="700">Visual material</text>
  <text x="114" y="187" fill="#94A3B8" font-size="11.5">the thing a user sees</text>
  <g fill="#CBD5E1" font-size="12.5">
    <text x="70" y="222">• screenshots &amp; mockups</text>
    <text x="70" y="242">• screen recordings</text>
    <text x="70" y="262">• real app workflows</text>
  </g>

  <!-- node 2: task spec -->
  <g filter="url(#shadow)">
    <rect x="290" y="130" width="200" height="164" rx="14" fill="#141D33" stroke="#263450"/>
    <rect x="290" y="130" width="200" height="4" rx="2" fill="url(#accent)"/>
  </g>
  <g transform="translate(312,154)">
    <rect width="34" height="34" rx="9" fill="#132038"/>
    <rect x="9" y="7" width="16" height="20" rx="2" fill="none" stroke="#60A5FA" stroke-width="1.8"/>
    <path d="M13 13h8M13 17h8M13 21h5" stroke="#60A5FA" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <text x="356" y="169" fill="#F8FAFC" font-size="15" font-weight="700">Task spec</text>
  <text x="356" y="187" fill="#94A3B8" font-size="11.5">TASK.md</text>
  <g fill="#CBD5E1" font-size="12.5">
    <text x="312" y="222">• multi-step, scoped files</text>
    <text x="312" y="242">• explicit state contract</text>
    <text x="312" y="262">• worked numeric examples</text>
  </g>

  <!-- node 3: objective criteria -->
  <g filter="url(#shadow)">
    <rect x="514" y="130" width="200" height="164" rx="14" fill="#141D33" stroke="#263450"/>
    <rect x="514" y="130" width="200" height="4" rx="2" fill="url(#green)"/>
  </g>
  <g transform="translate(536,154)">
    <rect width="34" height="34" rx="9" fill="#0F2A22"/>
    <circle cx="17" cy="17" r="9.5" fill="none" stroke="#34D399" stroke-width="1.8"/>
    <path d="M12.5 17.5 L15.8 20.5 L21.5 14" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="580" y="169" fill="#F8FAFC" font-size="15" font-weight="700">Objective criteria</text>
  <text x="580" y="187" fill="#94A3B8" font-size="11.5">pass / fail, no judgement</text>
  <g fill="#CBD5E1" font-size="12.5">
    <text x="536" y="222">• unit tests on the maths</text>
    <text x="536" y="242">• e2e on real pointer input</text>
    <text x="536" y="262">• asserts on state, not pixels</text>
  </g>

  <!-- node 4: reference build -->
  <g filter="url(#shadow)">
    <rect x="738" y="130" width="200" height="164" rx="14" fill="#141D33" stroke="#263450"/>
    <rect x="738" y="130" width="200" height="4" rx="2" fill="url(#violet)"/>
  </g>
  <g transform="translate(760,154)">
    <rect width="34" height="34" rx="9" fill="#1E1838"/>
    <path d="M12 10 L7 17 L12 24" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 10 L27 17 L22 24" fill="none" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M19 9 L15 25" stroke="#A78BFA" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="804" y="169" fill="#F8FAFC" font-size="15" font-weight="700">Reference build</text>
  <text x="804" y="187" fill="#94A3B8" font-size="11.5">solution branch</text>
  <g fill="#CBD5E1" font-size="12.5">
    <text x="760" y="222">• every test green</text>
    <text x="760" y="242">• CI on each push</text>
    <text x="760" y="262">• diff = exactly the task</text>
  </g>

  <!-- node 5: review guide -->
  <g filter="url(#shadow)">
    <rect x="962" y="130" width="190" height="164" rx="14" fill="#141D33" stroke="#263450"/>
    <rect x="962" y="130" width="190" height="4" rx="2" fill="url(#pink)"/>
  </g>
  <g transform="translate(984,154)">
    <rect width="34" height="34" rx="9" fill="#2A1422"/>
    <circle cx="15" cy="15" r="6.5" fill="none" stroke="#F472B6" stroke-width="2"/>
    <path d="M20 20 L26 26" stroke="#F472B6" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="1028" y="169" fill="#F8FAFC" font-size="15" font-weight="700">Review guide</text>
  <text x="1028" y="187" fill="#94A3B8" font-size="11.5">VERIFICATION.md</text>
  <g fill="#CBD5E1" font-size="12.5">
    <text x="984" y="222">• 10-minute procedure</text>
    <text x="984" y="242">• integrity checks</text>
    <text x="984" y="262">• accept / reject rules</text>
  </g>

  <!-- bottom strip -->
  <rect x="48" y="322" width="1104" height="58" rx="12" fill="#0F172A" stroke="#1E293B"/>
  <g font-size="12.5">
    <text x="72" y="357" fill="#94A3B8">Principle</text>
    <text x="140" y="357" fill="#E2E8F0" font-weight="600">Ambiguity is a defect in the task, not in the submission — if two reasonable builds would disagree, the spec gets fixed.</text>
  </g>
  <g transform="translate(1000,336)">
    <rect width="132" height="30" rx="15" fill="#0F2A22" stroke="#14532D"/>
    <circle cx="16" cy="15" r="4" fill="#34D399" filter="url(#glow)"/>
    <text x="28" y="19.5" fill="#A7F3D0" font-size="12" font-weight="600">reviewer-ready</text>
  </g>
</svg>
