<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111A2E"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="amber2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#60A5FA" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <pattern id="grid2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#bg2)"/>
  <rect width="1200" height="400" rx="18" fill="url(#grid2)" opacity="0.55"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="18" fill="none" stroke="#1F2A44"/>

  <text x="48" y="54" fill="#E2E8F0" font-size="22" font-weight="700">Interface design blueprint</text>
  <text x="48" y="78" fill="#94A3B8" font-size="13.5">One spec, three layers, verified at each — how I take an interface from mockup to shipped behaviour</text>
  <rect x="48" y="90" width="72" height="3" rx="1.5" fill="url(#blue)"/>

  <!-- spec bar -->
  <rect x="48" y="112" width="1104" height="40" rx="10" fill="url(#spec)" stroke="#3B82F6" stroke-opacity="0.5"/>
  <text x="600" y="137" text-anchor="middle" fill="#EFF6FF" font-size="13.5" font-weight="700" letter-spacing="0.3">UI SPEC  ·  mockup &amp; states  ·  expected behaviour  ·  what must NOT happen  ·  objective acceptance criteria</text>

  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow2)">
    <path d="M224 152 L224 176"/>
    <path d="M592 152 L592 176"/>
    <path d="M960 152 L960 176"/>
  </g>

  <!-- Visual design -->
  <g filter="url(#shadow2)">
    <rect x="48" y="178" width="352" height="118" rx="14" fill="#141D33" stroke="#263450"/>
    <rect x="48" y="178" width="352" height="4" rx="2" fill="url(#rose)"/>
  </g>
  <g transform="translate(70,200)">
    <rect width="34" height="34" rx="9" fill="#2A1420"/>
    <circle cx="17" cy="17" r="9" fill="none" stroke="#FB7185" stroke-width="1.8"/>
    <circle cx="13" cy="14" r="1.8" fill="#FB7185"/><circle cx="19" cy="12.5" r="1.8" fill="#FB7185"/><circle cx="22" cy="18" r="1.8" fill="#FB7185"/>
    <path d="M17 26c-3 0-4-2-3-4s4-2 5-1" fill="none" stroke="#FB7185" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <text x="114" y="215" fill="#F8FAFC" font-size="15" font-weight="700">Visual design</text>
  <text x="114" y="233" fill="#94A3B8" font-size="11.5">Figma · tokens · component system</text>
  <text x="70" y="268" fill="#CBD5E1" font-size="12.5">every state drawn: empty, hover, focus, disabled, error</text>
  <text x="70" y="286" fill="#CBD5E1" font-size="12.5">spacing &amp; type scale · colour contrast · motion rules</text>

  <!-- Interaction model -->
  <g filter="url(#shadow2)">
    <rect x="416" y="178" width="352" height="118" rx="14" fill="#141D33" stroke="#263450"/>
    <rect x="416" y="178" width="352" height="4" rx="2" fill="url(#blue)"/>
  </g>
  <g transform="translate(438,200)">
    <rect width="34" height="34" rx="9" fill="#132038"/>
    <path d="M10 9 L10 25 L14.5 20.5 L18 27 L21 25.5 L17.5 19 L24 19 Z" fill="none" stroke="#60A5FA" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
  <text x="482" y="215" fill="#F8FAFC" font-size="15" font-weight="700">Interaction model</text>
  <text x="482" y="233" fill="#94A3B8" font-size="11.5">state store · gestures · keyboard</text>
  <text x="438" y="268" fill="#CBD5E1" font-size="12.5">selection rules · pointer gestures · shortcuts · undo / redo</text>
  <text x="438" y="286" fill="#CBD5E1" font-size="12.5">focus order · ARIA roles · consistent under rapid input</text>

  <!-- Rendering -->
  <g filter="url(#shadow2)">
    <rect x="784" y="178" width="352" height="118" rx="14" fill="#141D33" stroke="#263450"/>
    <rect x="784" y="178" width="352" height="4" rx="2" fill="url(#amber2)"/>
  </g>
  <g transform="translate(806,200)">
    <rect width="34" height="34" rx="9" fill="#2A2210"/>
    <rect x="8" y="8" width="18" height="18" rx="2" fill="none" stroke="#FBBF24" stroke-width="1.8"/>
    <path d="M8 17h18M17 8v18" stroke="#FBBF24" stroke-width="1.4" stroke-dasharray="2 2"/>
  </g>
  <text x="850" y="215" fill="#F8FAFC" font-size="15" font-weight="700">Rendering</text>
  <text x="850" y="233" fill="#94A3B8" font-size="11.5">React · Canvas 2D · SVG</text>
  <text x="806" y="268" fill="#CBD5E1" font-size="12.5">hit-testing · bounding boxes · DPR-correct canvas</text>
  <text x="806" y="286" fill="#CBD5E1" font-size="12.5">60 fps interactions · no layout thrash · responsive</text>

  <!-- verification row -->
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow2)">
    <path d="M224 296 L224 318"/>
    <path d="M592 296 L592 318"/>
    <path d="M960 296 L960 318"/>
  </g>
  <g font-size="12.5" font-weight="600">
    <rect x="48" y="320" width="352" height="46" rx="12" fill="#0F2A22" stroke="#14532D"/>
    <circle cx="72" cy="343" r="4" fill="#34D399"/>
    <text x="86" y="347.5" fill="#A7F3D0">Design review against mockup · contrast &amp; a11y audit</text>

    <rect x="416" y="320" width="352" height="46" rx="12" fill="#0F2A22" stroke="#14532D"/>
    <circle cx="440" cy="343" r="4" fill="#34D399"/>
    <text x="454" y="347.5" fill="#A7F3D0">Playwright on real pointer &amp; keyboard · asserts on state</text>

    <rect x="784" y="320" width="352" height="46" rx="12" fill="#0F2A22" stroke="#14532D"/>
    <circle cx="808" cy="343" r="4" fill="#34D399"/>
    <text x="822" y="347.5" fill="#A7F3D0">Unit tests on geometry · explicit manual pixel checks</text>
  </g>
</svg>
